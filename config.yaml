control:
  ctxgate_proxy:
    health_url: http://127.0.0.1:9201/health
    kind: http
    port: 9201
    unit: ctxproxy-proxy.service
  worker:
    kind: file
    lock_path: /home/user/ctxproxy/worker/.worker.lock
    unit: ctxproxy-worker.service
dashboard:
  poll_interval: 3.0
  port: 9202
  watchdog_timeout: 30
db:
  dsn: postgresql://postgres:CHANGE_ME@127.0.0.1:5432/ctxproxy
proxy:
  api_key: ''
  goose_sessions_db: /home/user/.local/share/goose/sessions/sessions.db
  health_poll_fast: 2
  health_poll_slow: 30
  lm_studio_model: qwen3-4b-instruct-2507
  lm_studio_timeout: 120
  lm_studio_url: http://127.0.0.1:1234/v1
  max_body_bytes: 20971520
  max_context: 84000
  max_continuations: 5
  max_input: 64000
  max_output: 18000
  memory_ttl_days: 90
  worker_backpressure: 20
  safety_margin: 2000
  stream_read_stall: 120
  vllm_connect_timeout: 10
  vllm_model: Qwen3.8-27B
  vllm_pool_timeout: 10
  vllm_read_timeout: 300
  vllm_url: http://127.0.0.1:29000/v1
  vllm_write_timeout: 60
  wall_clock_max: 1800
services:
  ctxgate_proxy:
    type: http
    url: http://127.0.0.1:9201/health
  lm_studio:
    type: http
    url: http://127.0.0.1:1234/v1/models
  postgresql:
    host: 127.0.0.1
    port: 5432
    type: tcp
  vllm:
    type: http
    url: http://127.0.0.1:29000/v1/models
  worker:
    path: /home/user/ctxproxy/worker/.worker.lock
    type: file
